name: Velocity
options:
  bundleIdPrefix: com.velocity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

targets:
  Velocity:
    type: application
    platform: iOS
    sources:
      - path: Velocity
    dependencies:
      - package: MapLibre
    info:
      path: Velocity/Info.plist
      properties:
        CFBundleDisplayName: Velocity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Показываем вашу геопозицию на карте и строим маршрут от вас. / Shows your location on the map and routes from you."
        NSHealthShareUsageDescription: "Читаем велотренировки, чтобы показать трек, скорость и пульс. Данные остаются на устройстве. / Reads cycling workouts to show track, speed and heart rate. Data stays on device."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APIBaseURL: "http://192.168.1.11:8787"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grigorij.velocity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "7UGKHGR4T4"
        CODE_SIGN_STYLE: Automatic
